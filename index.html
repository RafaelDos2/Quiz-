<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Elo V // Desafio de Proteção Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <!-- Top Bar com Marca e Controle de Volume -->
        <div class="top-bar">
            <span class="brand-tag">🛡️ Elo V .Senac</span>
            <button class="btn-sound" id="btn-sound" onclick="toggleSound()">
                <span id="sound-icon">🔊</span>
                <span id="sound-label">Som: ON</span>
            </button>
        </div>

        <!-- 1. TELA INICIAL (SELEÇÃO DE MÓDULOS) -->
        <div class="screen start-screen active" id="start-screen">
            <div class="hero-icon">🛡️</div>
            <h1>Elo V</h1>
            <p>Desafio de Proteção Digital Teen<br><small style="color: #8b949e;">Aprenda a defender seus dados, jogos e contas digitais!</small></p>

            <div class="modules-title">Selecione o tamanho do desafio:</div>

            <div class="modules-grid">
                <button class="module-card" onclick="selectModule(3)">
                    <span class="module-number">3</span>
                    <span class="module-label">Perguntas</span>
                    <span class="module-tag">Rápido ⚡</span>
                </button>

                <button class="module-card featured" onclick="selectModule(6)">
                    <span class="module-number">6</span>
                    <span class="module-label">Perguntas</span>
                    <span class="module-tag">Recomendado ⭐</span>
                </button>

                <button class="module-card" onclick="selectModule(10)">
                    <span class="module-number">10</span>
                    <span class="module-label">Perguntas</span>
                    <span class="module-tag">Desafio Máximo 🔥</span>
                </button>
            </div>
        </div>

        <!-- 2. TELA DO QUIZ -->
        <div class="screen" id="quiz-screen">
            <div class="quiz-nav-bar">
                <button class="btn-back-home" onclick="goToHome()">⬅️ Início</button>
                <span class="quiz-title-tag">Teste de Segurança</span>
            </div>

            <div class="question" id="question-text">Carregando pergunta...</div>

            <div class="options" id="options-container"></div>

            <div class="footer">
                <span class="progress" id="progress-text">Pergunta 1 de 6</span>
                <button class="btn-next" id="btn-next" onclick="nextQuestion()">Próxima ➔</button>
            </div>
        </div>

        <!-- 3. TELA DE RESULTADO -->
        <div class="screen result-screen" id="result-screen">
            <h2>Missão Concluída!</h2>
            <div class="score-summary">
                <p class="score-correct" id="correct-text">✅ Acertos: 0</p>
                <p class="score-wrong" id="wrong-text">❌ Erros: 0</p>
            </div>
            <div class="badge" id="badge-text">Nível: Desconhecido</div>
            <br>
            <button class="btn-restart" onclick="restartQuiz()">Voltar ao Menu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
